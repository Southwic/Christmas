<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Merry Christmas 🎄</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-container">
  <h1 class="merry-heading">Merry Christmas!!🎄</h1>

  <div class="card">
    <img src="https://christmas-premium-free-demo.vercel.app/assets/intro1-s_qCk0Qz.png" class="floating-cat cat-right" alt="Cat Right">
    <img src="https://christmas-premium-free-demo.vercel.app/assets/intro2-CCQc74oB.png" class="floating-cat cat-left" alt="Cat Left">
    <div class="dots-container">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>
    <p class="message">Sorry for the late gift...I wanted to do a tiny something for you this Christmas...because you mean a lot to me.</p>
    <p class="instruction">Tap below, okay?</p>
    <button onclick="location.href='gallery.html'" class="gift-button">Open Your Gift &rarr;</button>
  </div>
  <footer class="footer">
    Made with love, lights & warm feelings 🎄🤍
  </footer>
  
  <footer class="footer">
    By Louis Dang
  </footer>


  <script src="script.js"></script>
</body>
</html>
